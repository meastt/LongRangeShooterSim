name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      # Build before anything that imports @aim/solver — the package's types
      # resolve to dist/, so a fresh checkout fails app typecheck without this.
      - name: Solver build
        run: npm run build -w @aim/solver

      - name: Solver tests
        run: npm run test:solver

      - name: App typecheck
        run: npx tsc --noEmit
        working-directory: app
